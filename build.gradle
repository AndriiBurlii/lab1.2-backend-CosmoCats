plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cosmocats'
version = 'v1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // --- Основні залежності ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // --- Тести ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.13.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.13.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Spring Security + OAuth2 Resource Server (Bearer JWT)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
    testImplementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'

}

// --- Jacoco загальні налаштування ---

jacoco {
    toolVersion = "0.8.11"
}

// Класи, які не враховуємо в покритті
def jacocoExcludes = [
        '**/CosmoCatsApplication.*',
        '**/config/**',
        '**/exception/**',
        '**/api/dto/**',
        '**/repository/**',
        '**/client/**'
]

// --- Налаштування тестів ---

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    systemProperty 'user.timezone', 'UTC'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    // після кожного тесту будуємо звіт jacoco
    finalizedBy jacocoTestReport
}

// --- Звіт Jacoco ---

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Беремо стандартні вихідні директорії Jacoco
    // і просто відфільтровуємо з них зайві пакети/класи
    classDirectories.setFrom(
            files(classDirectories.files.collect { f ->
                fileTree(f) {
                    exclude jacocoExcludes
                }
            })
    )
}

// --- Перевірка покриття Jacoco ---

jacocoTestCoverageVerification {
    dependsOn test

    classDirectories.setFrom(
            files(classDirectories.files.collect { f ->
                fileTree(f) {
                    exclude jacocoExcludes
                }
            })
    )

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// --- bootRun у таймзоні UTC ---

tasks.named('bootRun') {
    systemProperty 'user.timezone', 'UTC'
}
