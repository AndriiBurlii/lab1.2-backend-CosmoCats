databaseChangeLog:
  - changeSet:
      id: 0001-initial-schema
      author: cosmocats
      changes:
        # --- SEQUENCES ---
        - createSequence:
            sequenceName: category_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: product_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: order_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: order_line_seq
            startValue: 1
            incrementBy: 1

        # --- TABLE categories ---
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            constraintName: uk_category_code
            tableName: categories
            columnNames: code

        # --- TABLE products ---
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_product_category
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_product_name_category
            tableName: products
            columnNames: name, category_id
        - createIndex:
            indexName: idx_products_name
            tableName: products
            columns:
              - column:
                  name: name

        # --- TABLE orders ---
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: customer_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            constraintName: uk_order_number
            tableName: orders
            columnNames: order_number
        - addUniqueConstraint:
            constraintName: uk_order_customer_email
            tableName: orders
            columnNames: customer_email

        # --- TABLE order_lines ---
        - createTable:
            tableName: order_lines
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_lines
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: qty
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_order_line_order
            baseTableName: order_lines
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_order_line_product
            baseTableName: order_lines
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uk_order_line_order_product
            tableName: order_lines
            columnNames: order_id, product_id

      rollback:
        - dropTable:
            tableName: order_lines
        - dropTable:
            tableName: orders
        - dropTable:
            tableName: products
        - dropTable:
            tableName: categories
        - dropSequence:
            sequenceName: order_line_seq
        - dropSequence:
            sequenceName: order_seq
        - dropSequence:
            sequenceName: product_seq
        - dropSequence:
            sequenceName: category_seq
