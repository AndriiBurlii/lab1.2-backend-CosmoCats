services:
  db:
    image: postgres:16
    container_name: lab3-cosmocats-db
    environment:
      POSTGRES_DB: cosmocats
      POSTGRES_USER: cosmo
      POSTGRES_PASSWORD: cosmo
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmo -d cosmocats || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
